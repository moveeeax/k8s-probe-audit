apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cache
  namespace: shop
spec:
  serviceName: cache
  template:
    spec:
      containers:
        - name: redis
          image: redis:7.4
          livenessProbe:
            tcpSocket:
              port: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
