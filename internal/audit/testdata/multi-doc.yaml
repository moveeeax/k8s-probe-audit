apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: kube-system
data:
  log-level: info
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: agent
          image: ghcr.io/acme/agent:2.0.0
          readinessProbe:
            exec:
              command: ["/bin/ready"]
